# 「nüe 虐」「lüe 略」使用 nve lve。
# 「句、去、需、与」使用 ju qu xu yu。
# 「嗯 en eng ng」在词组中使用 en。
# 删除了「这zhei」「那nei」，只保留了「这zhe」「那na」。
